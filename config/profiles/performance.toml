[engine]
max_fps                 = 0
max_frame_delta_seconds = 0.25
max_outstanding_tasks   = 65536
max_worker_count        = 32
priority_aging_ms       = 150
queue_source_fairness   = true
worker_count            = 0

[file_asset_store]
cache_eviction_batch_mb    = 128
cache_unreferenced_assets  = true
default_async_priority     = "low"
maximum_cached_assets      = 8192
maximum_inflight_memory_mb = 512
maximum_pending_requests   = 8192
maximum_resident_memory_mb = 2048

[render_graph]
plan_cache_entries      = 0
plan_cache_max_elements = 65536
quality                 = "auto"
transient_aliasing      = true
transient_budget_mb     = 1024

[renderer]
backend                              = "auto"
device                               = "auto"
draw_sort_min_commands               = 2
draw_sort_mode = "mesh_material"
frustum_culling                      = true
gpu_timestamps_enabled = true
headless_transform_cache_mb          = 64
instance_batch_min_count             = 4
instance_batching = true
instance_stream_mb                   = 4
max_frames_in_flight                 = 3
max_pending_uploads                  = 128
memory_budget_update_interval_frames = 120
texture_mipmaps                      = false
validation                           = false
vsync = false
