[engine]
max_frame_delta_seconds = 0.25
max_outstanding_tasks   = 65536
max_worker_count        = 16
priority_aging_ms       = 250
queue_source_fairness   = true
worker_count            = 0

[file_asset_store]
cache_eviction_batch_mb    = 64
cache_unreferenced_assets  = true
default_async_priority     = "low"
maximum_cached_assets      = 4096
maximum_inflight_memory_mb = 128
maximum_pending_requests   = 4096
maximum_resident_memory_mb = 1024

[render_graph]
plan_cache_entries      = 0
plan_cache_max_elements = 16384
quality                 = "auto"
transient_aliasing      = true
transient_budget_mb     = 512

[renderer]
backend                              = "auto"
device                               = "auto"
draw_sort_min_commands               = 2
draw_sort_mode = "mesh_material"
frustum_culling                      = true
gpu_timestamps_enabled = true
headless_transform_cache_mb          = 32
instance_batch_min_count             = 4
instance_batching = true
instance_stream_mb                   = 4
max_frames_in_flight                 = 2
max_pending_uploads                  = 64
memory_budget_update_interval_frames = 120
texture_mipmaps                      = false
validation                           = false
vsync = false
