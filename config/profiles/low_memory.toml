[engine]
max_worker_count      = 6
priority_aging_ms     = 500
queue_source_fairness = true
worker_count          = 0

[file_asset_store]
cache_eviction_batch_mb    = 4
cache_unreferenced_assets  = true
default_async_priority     = "low"
maximum_cached_assets      = 1024
maximum_inflight_memory_mb = 32
maximum_pending_requests   = 512
maximum_resident_memory_mb = 256

[render_graph]
plan_cache_entries      = 0
plan_cache_max_elements = 2048
quality                 = "auto"
transient_aliasing      = true
transient_budget_mb     = 128

[renderer]
backend                              = "auto"
device                               = "auto"
draw_sort_min_commands               = 2
draw_sort_mode                       = "off"
frustum_culling                      = true
gpu_timestamps_enabled               = false
headless_transform_cache_mb          = 8
instance_batch_min_count             = 4
instance_batching                    = false
instance_stream_mb                   = 4
max_frames_in_flight                 = 1
max_pending_uploads                  = 8
memory_budget_update_interval_frames = 120
texture_mipmaps                      = false
validation                           = false
vsync                                = true
