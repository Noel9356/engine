# Light leak test scene.
#
# A sealed room (no sun, no sky: sky_radiance = 0 closes every escaped ray)
# with an emissive panel inside and a single window opening in the front wall.
# The camera looks at the sealed front wall from outside:
#
#   - the wall around the window must stay dark: any radiance there is light
#     that crossed the wall (the leak the cascades must not produce);
#   - the region inside the window must be bright: the interior is lit only by
#     the GI transport from the emissive panel, so a dark window means the GI
#     path is dead (which would otherwise make the sealed check pass for the
#     wrong reason).
#
# The [leak_test] section drives the assertions evaluated by --leak-check
# (exit code 4 on failure). Regions are normalized screen coordinates.
# This configuration defines its own [scene] - deliberately, and completely:
# the installed content mod's scene file is never merged into it (a defaults
# file could not define [scene] even by accident), so the sealed room's zero
# sky does not depend on what content packages happen to be installed.

[engine]
modules = ["logging", "window", "input", "renderer", "pbr", "radiance_cascades", "screenshot", "lua_scripting"]

[logging]
level = "information"

[window]
title = "engine leak test"
width = 480
height = 270
resizable = false

[renderer]
enable_validation = true
vsync = false
exposure = 1.0
tonemap = "none"

[lighting]
techniques = ["radiance_cascades"]

[lighting.pbr]
shadows = false

[lighting.radiance_cascades]
cascades = 5
interval_base = 0.5
interval_factor = 2.0
probe_stride = 4
base_rays = 64
gather_visibility = true
los_steps = 16
march_steps = 48
relight_shadows = false
spatial_filter = 2

[scene]
# Zero sky: rays that escape the scene carry nothing back.
sky_radiance = [0.0, 0.0, 0.0]
[scene.sky]
sun_disk = false

[scene.camera]
# Headless run: pin the camera (a captured cursor on Xvfb can emit
# phantom motion deltas that would drift the pose between runs).
free_fly = false
position = [0.0, 1.5, 6.0]
look_at = [0.0, 1.5, 0.0]
fov = 60.0

# No sun; the light sources are a point light inside the sealed room (exact
# analytic relight, no angular sampling error) plus the emissive panel.

# Sealed test room: 3x3x3, thin walls, window opening in the +z wall.
[[scene.objects]]
type = "plane"
position = [0.0, 0.0, 0.0]
size = [1.5, 0.01, 1.5]
albedo = [0.8, 0.8, 0.8]
roughness = 0.9

[[scene.objects]]
type = "plane"
position = [0.0, 3.0, 0.0]
size = [1.5, 0.01, 1.5]
albedo = [0.8, 0.8, 0.8]
roughness = 0.9

[[scene.objects]]
type = "plane"
position = [0.0, 1.5, -1.5]
size = [1.5, 1.5, 0.01]
albedo = [0.8, 0.8, 0.8]
roughness = 0.9

[[scene.objects]]
type = "plane"
position = [-1.5, 1.5, 0.0]
size = [0.01, 1.5, 1.5]
albedo = [0.8, 0.8, 0.8]
roughness = 0.9

[[scene.objects]]
type = "plane"
position = [1.5, 1.5, 0.0]
size = [0.01, 1.5, 1.5]
albedo = [0.8, 0.8, 0.8]
roughness = 0.9

# Front wall (+z) with a window opening at x -0.4..0.4, y 1.2..1.8.
[[scene.objects]]
type = "plane"
position = [-0.95, 1.5, 1.5]
size = [0.55, 1.5, 0.01]
albedo = [0.8, 0.8, 0.8]
roughness = 0.9

[[scene.objects]]
type = "plane"
position = [0.95, 1.5, 1.5]
size = [0.55, 1.5, 0.01]
albedo = [0.8, 0.8, 0.8]
roughness = 0.9

[[scene.objects]]
type = "plane"
position = [0.0, 0.6, 1.5]
size = [0.4, 0.6, 0.01]
albedo = [0.8, 0.8, 0.8]
roughness = 0.9

[[scene.objects]]
type = "plane"
position = [0.0, 2.4, 1.5]
size = [0.4, 0.6, 0.01]
albedo = [0.8, 0.8, 0.8]
roughness = 0.9

# Point light inside the sealed room (the transport source for the test).
[[scene.point_lights]]
position = [0.0, 2.2, 0.0]
color = [1.0, 0.95, 0.85]
intensity = 18.0

# Emissive panel inside (visible through the window; also a GI source).
[[scene.objects]]
type = "box"
position = [0.0, 2.93, 0.0]
size = [0.7, 0.03, 0.7]
albedo = [1.0, 0.95, 0.85]
emissive_strength = 12.0

[leak_test]
# Left part of the screen: sealed wall (and void beside it) - must stay dark.
region = [0.04, 0.08, 0.36, 0.92]
max_luminance = 0.02
# Window area: the interior behind it is lit purely by GI - must be bright.
lit_region = [0.44, 0.40, 0.56, 0.60]
min_lit_luminance = 0.03
