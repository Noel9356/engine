[diagnostics]
profiling_enabled = true

[engine]
active_plugins             = ["main_menu"]
max_fps                 = 60
max_frame_delta_seconds = 0.25
max_outstanding_tasks   = 65536
max_worker_count        = 16
priority_aging_ms       = 250
queue_source_fairness   = true
worker_count            = 0

[pbr]
sun_direction = [-0.55, 0.34, -0.76]

[renderer]
clear_color = [0.18, 0.3, 0.5, 1.0]
# The headless LOD path decimates by striding the index list, which shreds
# close-up organic meshes into scattered fragments at any level above 0.
# Meshes that stay near the camera for a whole run (hero characters, UI
# props) therefore run with LOD switching off; see the demos' own configs
# for per-view choices.
lod_enabled = false

[trust]
trustPlugins = ["main_menu"]
# The renderer acquires six capabilities now that it consumes the optional
# lumen_gi probe grid and the lumen_reflection field (window + window.vulkan
# + pbr + direct_lighting + lumen_gi + lumen_reflection), which the trust
# gate flags as "broad"; first-party modules are trusted by name.
trustModules = ["renderer"]

[window]
# The shared default resolution is 1920x1080 across every backend and demo:
# captures and interactive runs share one presentation size, so screenshots
# compare directly against what a windowed run shows.
height = 1080
width  = 1920
