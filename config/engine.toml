# engine runtime configuration - the ASSEMBLY layer.
#
# Paths are resolved relative to the engine executable directory.
#
# This file is the highest file-backed configuration layer, and it owns
# exactly what an assembly owns: the runtime layout, the provider wiring and
# the permission policy. It deliberately holds NO module settings: every
# module ships its own defaults in modules/<name>/config.toml (copied to
# runtime/config/modules/<name>/config.toml by the build), and every content
# package ships its own in mods/<id>/config.toml. Those defaults FILL every
# key this file leaves unset - anything written HERE wins over them, which
# is the whole override story: to tune a module for this assembly, add its
# section here; to change what a module does everywhere, edit the module's
# own config.toml. The precedence rules and the provenance report are
# documented in docs/configuration.md.
#
# The world content lives with the content mod: mods/test_scene declares
# scene.toml in its manifest, and this file deliberately defines no [scene]
# section - the demo room, camera and sun come from that package. An assembly
# that wants its own world defines [scene] here (it then wins over every
# installed content mod).

[engine]
# Modules are NOT listed here and there is no demand list either: the active
# mods are the sole demand source. A module loads only when an active mod's
# manifest requires a capability it provides, and the providers' own
# requirements pull their dependencies transitively (the renderer, for
# example, brings window and logging with it). A capability no mod requires
# stays dormant: its plugin is never instantiated. This assembly's demo
# pipeline is demanded by the shipped content mod (mods/test_scene): camera
# input, frame rendering, the scene light state, the direct PBR pass, the
# screen-space radiance cascades GI, the ray-traced reflections and key-triggered
# captures.

# Mod packages are discovered on disk, not listed here: every subdirectory of
# mod_directory that contains a mod.toml is a mod. The content package
# (mods/test_scene) arrives with the runtime.
# mod_directory = "mods"

# Hot reload (development loop): add "hot_reload" to a mod's required
# capabilities and the watcher joins the run - shader, script and config
# changes surface as events while the engine is running. Demand-driven like
# every module: a run whose mods do not demand it never pays for it.
# [hot_reload]
# watch_interval_ms = 250

# Mod ids listed here are skipped during discovery; useful to keep a package
# installed but inactive without deleting it. Disabling the content mod also
# removes its world: the run then renders an empty scene unless the assembly
# defines [scene] itself.
# disabled_mods = ["test_scene"]

# Provider selection for capabilities that several implementations offer.
# The key is the capability name (a family such as "renderer" when the
# candidates are its implementation-bound members), the value is the
# component name that should win. Only needed when more than one
# implementation is present in the build.
[providers]
# physics = "physics_builtin"

# Permission denials. Each entry denies one declared permission of one
# component (module, native mod or script mod); denied permissions fail
# startup with a precise diagnostic.
[permissions]
# denied = [["example_cpp_mod", "capability.input"]]

# Diagnostics are opt-in: the shutdown communication latency and frame-time
# report is a developer tool. Enable it here.
[diagnostics]
latency_report = false

# ---------------------------------------------------------------------------
# Module overrides (all optional - every module runs on its own shipped
# defaults without a single line here). A section written below replaces the
# module defaults key by key, never wholesale: tables deep-merge, so a
# one-key override leaves the module's other defaults standing.
#
# Where each module's settings live:
#
#   [logging]                     modules/logging_stdout/config.toml
#   [window]                      modules/window_glfw/config.toml
#   [input] / [input.actions]     modules/input_glfw/config.toml (+ the
#                                 content mod's config.toml for its bindings)
#   [renderer]                    modules/renderer_vulkan/config.toml
#   [lighting] (max_roughness)    modules/pbr/config.toml
#   [lighting.pbr]                modules/pbr/config.toml
#   [lighting.screen_space_radiance_cascades]  modules/screen_space_radiance_cascades/config.toml
#   [lighting.ray_reflections]    modules/ray_reflections/config.toml
#   [physics]                     modules/physics_builtin/config.toml
#   [bvh]                         modules/bvh/config.toml
#   [screenshot]                  modules/screenshot_png/config.toml
#
# Examples - uncomment to override:
#
# [renderer]
# exposure = 1.4
#
# [lighting.screen_space_radiance_cascades]
# mapping = "cubemap"        # octahedron (default) | cubemap | spherical_harmonic
# bounces = 2                # screen-space GI bounce count (default 1)
#
# [bvh]
# split = "sah"              # midpoint (default) | median | sah
#
# [input.actions]
# boost = "RightShift, gamepad:A"
