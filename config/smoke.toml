# Headless smoke configuration: small resolution and reduced GI cost so the
# run stays fast on software rasterizers (lavapipe) while still exercising the
# full pipeline - geometry, direct PBR, radiance cascades, composite, capture.
# This configuration defines its own [scene]: the assembly owns the world, so
# the installed content mod's scene file is not applied (and --validate would
# say so in a warning).

[engine]
modules = ["logging", "window", "input", "renderer", "pbr", "radiance_cascades", "ray_reflections", "screenshot",
           "lua_scripting"]

[logging]
level = "information"

[window]
title = "engine smoke"
width = 480
height = 270
resizable = false

[renderer]
enable_validation = true
vsync = false
exposure = 1.1
tonemap = "aces"

[lighting]
techniques = ["pbr", "radiance_cascades", "ray_reflections"]

[lighting.pbr]
shadows = false
shadow_steps = 8

[lighting.radiance_cascades]
cascades = 5
interval_base = 0.5
interval_factor = 2.0
probe_stride = 8
base_rays = 12
gather_visibility = true
los_steps = 12
march_steps = 32
relight_shadows = false
spatial_filter = 1
shadow_steps = 8

[scene]
sky_radiance = [0.22, 0.30, 0.48]

[scene.camera]
# Headless run: pin the camera (a captured cursor on Xvfb can emit
# phantom motion deltas that would drift the pose between runs).
free_fly = false
position = [0.0, 1.55, 2.9]
look_at = [0.0, 1.05, -0.4]
fov = 62.0

[scene.sun]
direction = [-0.35, -0.75, -0.55]
color = [1.0, 0.94, 0.82]
intensity = 3.2

