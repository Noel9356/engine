# Shipped defaults of the test scene mod. Defaults fill only what the
# assembly left unset (docs/configuration.md): every configuration that does
# not set renderer.texture_directory inherits the path into this package,
# and any assembly value wins over it. [scene] is deliberately
# absent here - world content has a dedicated channel (scene.toml, declared
# through the manifest's scene key), and a defaults file defining [scene]
# fails startup with a precise error.

[renderer]
# The texture sets this package's scene references live in the package's
# assets/textures/ directory, which the build copies into
# runtime/mods/test_scene/assets/textures/. The path resolves relative to
# the engine executable, like every runtime path.
texture_directory = "mods/test_scene/assets/textures"

# The action bindings this package's content reads (the shipped free-fly
# demo). Actions bind by MEANING, not by device (see
# modules/input_glfw/README.md): the script and the camera controller query
# actionStrength(name), and a rebinding is a configuration edit, no code.
# An assembly overrides any binding from its own [input.actions] - the
# assembly layer always wins over this one.
[input.actions]
boost = "LeftShift, gamepad:A"
release_cursor = "Escape"
