# Default values for the [lumen_gi] configuration section. Every key is
# documented in docs/configuration.md; the budgets follow Lumen's published
# defaults scaled for CPU evaluation.

[lumen_gi]
enabled = true
# Static-frame skip: when the camera, the scene, and the environment are all
# unchanged and the caches have converged (a full probe-update cycle plus a
# small margin), evaluate() returns early instead of re-blending the same
# radiance, and the exported probe version stops changing (renderers polling
# it skip their per-frame upload too). Set false to always run the pipeline.
skip_unchanged_frames = true
# Quality preset (Auto 0, Low 1, Medium 2, High 3, Ultra 4) scales the
# amortization budgets below; explicit budget keys still cap the result.
quality = 3

[lumen_gi.scene]
max_surfaces                = 256
max_triangles_per_surface   = 200000

[lumen_gi.cards]
# Lumen's default is 12 cards per mesh (Max Lumen Mesh Cards). When a surface
# would need more, the texel density is lowered so every face stays covered.
per_surface_max             = 12
texels_per_meter            = 24.0
max_texels_per_card_axis    = 128
# Total layered texels one surface's card set may hold (depth layers
# multiply every texel). A mesh whose cards would exceed the budget has its
# texel density lowered until it fits, so one registration cannot claim an
# unbounded card-set footprint.
max_texels_per_surface      = 524288
# Depth layers per card texel: each (x, y) texel keeps up to this many
# front-facing hits, so a concave mesh (a room modelled as one mesh) keeps the
# faces that sit behind a nearer one. 1 = the old single-layer capture.
depth_layers                = 2

[lumen_gi.capture]
# Lumen captures a fixed 512x512 texel budget per frame.
texels_per_frame            = 262144

[lumen_gi.lighting]
direct_texels_per_frame     = 65536
indirect_texels_per_frame   = 65536
# Stratified cosine rays per refreshed texel; the rotating strata and the
# temporal history below accumulate the samples across updates (1 ray x ~10
# refreshes, filtered by the blend weight), so the gather pays one trace per
# refreshed texel while the cache still converges to the smoothed radiance.
indirect_rays_per_texel     = 1
sun_shadows                 = true
point_light_shadows         = false
# Lumen's "Lumen Scene Lighting Update Speed"; scales how fast the cached
# lighting is re-evaluated relative to the budgets above.
update_speed                = 1.0
# Weight of the cached history when a texel is refreshed (0 = replace with the
# fresh gather, 0.99 = almost never change). The first update of a texel
# always takes the fresh sample whole. Raised alongside the one-ray gather so
# the sparser fresh samples are smoothed by the accumulation.
indirect_temporal_blend     = 0.85

[lumen_gi.trace]
max_distance_m              = 50.0
# Surface offset for shadow, gather, and probe rays; one bias behind every
# trace site so the acne/leak trade-off is a single tuning decision.
bias_m                      = 0.02
# How many interfaces a gather, probe, or shadow ray may cross through
# transparent or translucent surfaces. Rays past the budget treat the next
# opaque surface as blocking. A glass pane costs two crossings (entering and
# exiting the medium).
max_transmission_segments   = 3

[lumen_gi.probes]
spacing_m                   = 2.0
direction_resolution        = 32
updates_per_frame           = 64
# Rays traced per probe update; the direction map is refreshed in rotating
# strata (direction_resolution^2 / rays_per_update updates per full refresh).
# A probe without data traces every direction once.
rays_per_update             = 256
# Fraction of the previous radiance kept when a texel is re-traced.
hysteresis                  = 0.2
# Dynamic relight: probes whose lattice position falls inside a moved,
# deformed, created, or destroyed surface's swept volume (expanded by this
# radius) retrace from scratch, so dynamic geometry refreshes the world
# radiance cache within a few frames. 0 disables the marking.
dynamic_relight_radius_m    = 2.0
# Near-surface clearance a relocated probe keeps off the geometry it was
# pushed away from, as a fraction of the level spacing. Also the margin added
# when a boundary probe steps off a surface plane. The exported lattice stays
# regular regardless.
relocation_margin           = 0.05
level1_spacing_factor       = 4.0

[lumen_gi.gather]
# Screen-space final gather (Lumen's opaque Final Gather): probes at
# 1/screen_scale of the internal resolution, a few rays each, 2 m short rays
# falling back to the world radiance cache.
screen_scale                = 8
rays_per_probe              = 32
importance_sampling         = true
screen_ray_distance_m       = 2.0
temporal_blend              = 0.85
# Weight of a screen probe direction texel's previous radiance when the pass
# retraces it: the probe maps converge to the running mean of their traces
# instead of re-showing each pass' single-sample variance through the pixel
# interpolation. 0 disables the accumulation (each pass traces from scratch).
probe_temporal_blend        = 0.9
spatial_filter              = 3
plane_depth_tolerance       = 0.35

[lumen_gi.caustics]
# Photon-differential caustics: photons traced from the sun (and the
# registry's directional lights) through the transmissive surfaces, refracted
# with the same Snell rules every other ray uses, and deposited onto the
# receivers' card texels as focused irradiance. The deposits live in the
# surface cache, so the indirect gathers, the world radiance cache probes
# (SH2-softened), and the final gather all carry them.
enabled                    = true
photons_per_frame          = 1024
# Weight of the previous estimate when a texel receives a fresh deposit;
# untouched texels decay toward the current (usually zero) estimate by the
# same weight, so a caustic whose source moved fades instead of ghosting.
temporal_blend             = 0.9
# Footprint radius clamps: the floor stops single-texel fireflies, the
# ceiling stops a degenerate differential from smearing the whole card.
footprint_min_m            = 0.01
footprint_max_m            = 0.75
# Emit caustic photons from emissive card texels (interior scenes lit only
# by emissive panels get their caustics this way; the sun covers outdoor
# scenes).
emissive_sources           = true

[lumen_gi.debug]
internal_width              = 320
internal_height             = 180
reference_samples           = 64
reference_bounces           = 4
include_ambient             = false
# The module's screen-space final gather only feeds the debug views, so it runs
# on demand when a view is exported (export_gather_frames accumulation passes
# first so the temporal filter has converged). Set continuous_gather = true to
# run one pass every evaluate() instead (costs CPU every frame).
continuous_gather           = false
export_gather_frames        = 24

[lumen_gi.environment]
# The built-in fallback environment the module shades with when the optional
# pbr capability is absent (with pbr present, its environment wins and these
# keys are unused). Defaults match the renderer's built-in environment.
sun_direction               = [0.45, 0.62, 0.35]
sun_color                   = [1.0, 0.96, 0.88]
sun_intensity               = 3.0
sun_enabled                 = true
ambient_sky                 = [0.55, 0.65, 0.80]
ambient_ground              = [0.35, 0.30, 0.25]
ambient_intensity           = 0.5
