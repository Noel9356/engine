[models]
flip_texture_v        = true
format                = "auto"
import_materials      = true
import_vertex_colors  = false
material_search_path  = ""
max_file_size_mb      = 512
max_loaded_models     = 256
normal_mode           = "preserve_smooth_missing"
optimize_mesh         = true
optimize_overdraw     = true
optimize_vertex_cache = true
optimize_vertex_fetch = true
overdraw_threshold    = 1.05
pivot                 = [0.0, 0.0, 0.0]
rotation              = [0.0, 0.0, 0.0, 1.0]
scale                 = [1.0, 1.0, 1.0]
search_paths          = ["assets/models"]
translation           = [0.0, 0.0, 0.0]
uv_offset             = [0.0, 0.0]
uv_scale              = [1.0, 1.0]
weld_vertices         = true
winding_mode          = "automatic"
