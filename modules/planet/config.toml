# planet module configuration defaults.
#
# Every generation knob of the module lives here; the struct defaults in
# params.hpp mirror these values. All lengths are meters (planets scale to
# arbitrary radii - raise radius_meters and the wavelengths/amplitudes that
# should scale with it), angles/axes are unit vectors, colors are linear RGB
# rows in Biome enum order (see types.hpp).

[planet]
seed                   = 1337
# The showcase planet is 60 km across (radius 60000 m): with Earth-like relief
# amplitudes the relief fraction lands near real planets (~1%), so globe views
# read as a planet instead of a spiked marble. The large-scale relief layers
# below have wavelengths scaled to this radius; the close-range layers (hills
# and finer) stay metric and do not care about the radius.
radius_meters          = 60000.0
sea_level_offset_meters = 0.0
axis                   = [0.0, 1.0, 0.0]

# octree / LOD
leaf_grid_n              = 16
target_voxel_meters      = 2.5
# Hard depth cap (also bounded by the chunk key's 4-bit depth field).
max_depth_limit          = 15
# refine while the chunk's voxel subtends more than this many radians at the
# eye (screen-space LOD): detail follows apparent size, independent of planet
# radius, viewport and zoom. Smaller = finer views everywhere, but the visible
# chunk count grows quadratically; 0.02 keeps the finest voxel within ~200 m
# of a ground-level eye.
lod_angular_voxel_radians = 0.02
# per-depth low-pass: density content below voxel * factor fades out before
# coarse chunks sample it. Without this, sub-voxel detail octaves alias into
# random spikes on every coarse LOD surface (the "spiky globe"). Marching
# cubes needs ~4 samples per wavelength for smooth surfaces: 2.0 fades content
# out below 2 voxels and lets it render at full strength from 4 voxels up.
# Raise it to trade close-range roughness for cheaper, smoother chunks.
lod_band_limit_factor    = 2.0
horizon_culling          = true
bounding_factor          = 1.4
# async chunk builds: several thousand chunks can be selected at once by the
# screen-space LOD on ground views, so the pipeline runs wide open by default
# (one build per worker). Lower these for interactive use on small machines.
max_concurrent_builds    = 16
max_new_builds_per_update = 48
chunk_eviction_updates   = 240
# The cache must hold the whole visible set plus working room: at ground views
# on the 60 km planet the screen-space LOD selects ~9000 chunks (depth 4-12);
# a cache smaller than the visible set evicts ready meshes and rebuilds them
# in a churn loop.
chunk_cache_capacity     = 16384

# relief shaping
# Large-scale layers (continents ... regional) carry wavelengths scaled to the
# 60 km radius: the globe's coarse LOD chunks (voxels of roughly 1-3 km at
# globe view) can then resolve them, which is what makes the planet read as
# textured landmasses and mountain ranges instead of smooth blobs.
continent_amplitude_meters   = 560.0
continent_wavelength_meters  = 34000.0
# Fewer octaves = fewer medium patches: landmass cores stay contiguous and
# coastline complexity comes from the warp plus the hills near the shore.
continent_octaves            = 4
# domain_warp_amplitude is an ANGULAR displacement (fraction of a radian-ish
# bend of the sample direction): at radius R it shears features by roughly
# amplitude * R meters. 0.18 at 60 km bends coastlines by ~10 km without
# shredding landmasses into filaments (0.5 sheared ~30 km - archipelagos).
domain_warp_amplitude        = 0.18
domain_warp_wavelength_meters = 14000.0
mountain_amplitude_meters    = 1100.0
mountain_wavelength_meters   = 9000.0
mountain_mask_low            = 0.08
mountain_mask_high           = 0.45
mountain_sharpness           = 1.25
mountain_octaves             = 5
# mountain profile shaping: the ridged crest field rides on a broad smooth
# mass field (mountain_mass_fraction splits the amplitude), and a broad
# range-cluster field groups uplift into distinct ranges with foothill gaps
# (range_cluster_strength). Without them, mountains read as uniform
# needle/rib carpets.
mountain_mass_fraction        = 0.50
range_cluster_strength        = 0.55
range_cluster_wavelength_meters = 20000.0
# regional relief: broad plateaus/basins/valley systems between the continent
# and hill bands - the layer that carries landform structure at globe scale.
regional_amplitude_meters    = 80.0
regional_wavelength_meters   = 6500.0
regional_octaves             = 3
# Close-range layers stay metric (independent of the planet radius): rolling
# hills, surface roughness, overhangs and strata are features a walker sees.
hill_amplitude_meters        = 110.0
hill_wavelength_meters       = 1000.0
hill_octaves                 = 5
# fine detail layer: surface roughness between the hill wavelength and the
# voxel size (rock ribs, soil ripples). detail_plains_fraction keeps flat
# ground walkable (values above ~0.3 boil plains into noise lumps);
# mountains/cliffs carry full strength.
detail_amplitude_meters      = 14.0
detail_wavelength_meters     = 120.0
detail_plains_fraction       = 0.22
detail_octaves               = 4
terrace_strength             = 0.95
terrace_steps                = 9.0
# Fraction of each terrace step the riser spans; small values make the
# genuinely cliff-like faces (grade = flank slope / fraction). 0.4 smears
# steps into long shoulders; below ~0.1 the riser thins under one voxel.
terrace_riser_fraction       = 0.15
cliff_wavelength_meters      = 1400.0
# Cliff-mask gate over the terrain's own steepness energy. Terracing, strata
# banding and overhang weighting ride this mask, so the gate decides where
# mesa country forms: the mask opens where the cliff-noise crest bands
# (cliff_sharpness concentrates them) or mountain massif flanks carry real
# slope, keeping plains smooth. Lower cliff_steepness_low widens terraced
# country; raise cliff_sharpness to tighten it into narrow band country.
cliff_steepness_low          = 0.42
cliff_steepness_high         = 0.70
cliff_sharpness              = 2.6

# true-3D terms (overhangs, strata, caves)
# overhang_plains_fraction: how much 3D displacement survives on flat ground;
# large values boil plains into noise lumps.
overhang_amplitude_meters   = 38.0
overhang_wavelength_meters  = 300.0
overhang_plains_fraction    = 0.06
# strata: banded rock on cliff faces. strata_warp bends the bands; values
# >= 2 fold the sinusoid into nested ripple rings (an artefact, not geology).
strata_amplitude_meters     = 3.0
strata_band_meters          = 34.0
strata_warp                 = 1.1
# strata is additionally gated to genuinely terraced country (cliff mask above
# ~0.65) inside the field; open slopes keep no corduroy banding at all.
caves_enabled               = false
cave_threshold              = 0.16
cave_worm_wavelength_meters = 240.0
cave_carve_meters           = 60.0

# coastal shaping: detail (hills, terraces, overhangs, strata) is damped
# toward the waterline so shorelines slope into the sea instead of breaking
# into a web of sub-sea ponds with beach rims.
coastal_flatten_meters      = 80.0
coastal_flatten_floor       = 0.10

# oceans
shallow_water_meters    = 18.0
deep_water_meters       = 140.0
# Abyssal deepening: the sea floor sinks from the shoreline into the basins
# toward this extra depth (on top of the continent amplitude), carving real
# ocean profiles - sunlit shelves at the coast sloping into dark abyssal
# plains - instead of one uniformly shallow flooded plain. 0 disables.
abyssal_depth_meters    = 3500.0
water_depth_tint_meters = 70.0
# Shallow shelf: the surface blends toward the beach-sand tone transmitted
# by the water's own hue over this depth band, so flats read sandy turquoise
# (the bottom seen through the sheet). 0 disables.
water_shore_mix_meters  = 3.0
water_enabled           = true
water_color_shallow     = [0.085, 0.320, 0.330]
water_color_deep        = [0.012, 0.060, 0.130]
# gloss of the ocean surface: low = mirror-sharp sun glints (the coarse
# far-water facets then band at grazing angles), high = matte.
water_roughness         = 0.42
# Surf: a white breaker band where the water shallows toward the shore,
# noise-modulated so it breaks into wave crests instead of a painted stripe.
# Strength 0 disables; width is the depth band under the surface that reads
# as surf (real breaker zones sit in the first few meters of depth).
water_foam_width_meters = 2.5
water_foam_strength    = 0.70

# sea ice: the water surface freezes where the SEA-LEVEL temperature drops
# below sea_ice_temperature (the same climate field that drives the land's
# freeze line, so polar oceans ice over where the land turns tundra, with an
# organic noise-shaped edge). 0 disables. sea_ice_transition blends the ice
# color in over that much temperature around the threshold.
sea_ice_temperature     = 0.10
sea_ice_transition      = 0.05
# Sea ice reads slightly BLUE against the warm white of the cloud tops, so
# polar caps stay distinguishable from the weather layer at globe scale.
water_color_ice         = [0.78, 0.85, 0.94]

# wave slope: deterministic noise tilts the water surface normals around the
# radial direction, giving the sea sun-glint texture at close range. The
# amplitude is a radian-scale tilt and fades out under the LOD band limit
# like every other noise term, so coarse chunks keep a smooth sea.
water_wave_amplitude          = 0.16
water_wave_wavelength_meters  = 8.0

# clouds: a pure coverage field on a spherical shell above the datum (see
# atmosphere.hpp). The demo meshes the shell for its globe and orbit views;
# consumers can paint the same field anywhere. cloud_coverage is the
# approximate sky fraction under cloud, cloud_wavelength_meters the feature
# scale (raise it with radius_meters like the other large-scale layers),
# cloud_altitude_meters the shell height, and cloud_detail_strength the
# amplitude of the fine breakup octave (bank edges read as ragged cumulus).
# cloud_edge_softness is the threshold band half-width: narrow values scatter
# crisp clumps, wide ones grow soft decks with veiled edges.
# cloud_weather_strength is the amplitude of the very-low-frequency regional
# weather shift that organizes banks into large cloudy and clear systems.
# cloud_latitude_band_strength adds the circulation-cell banding every
# rotating atmosphere shows (wet equatorial belt, dry subtropics, stormy
# mid-latitudes), keyed to the spin axis.
clouds_enabled               = true
cloud_coverage               = 0.42
cloud_wavelength_meters      = 9000.0
cloud_altitude_meters        = 1200.0
cloud_detail_strength        = 0.45
cloud_edge_softness          = 0.10
cloud_weather_strength       = 0.45
cloud_latitude_band_strength = 0.16
cloud_color                  = [0.985, 0.975, 0.955]
# cloud_shadow_strength darkens the terrain and water albedo under the same
# coverage field the cloud layer renders from, sampled along the sun ray
# through each point (see cloud_shadow_sun_direction), so the shadows fall
# away from their banks and agree with the cloud layer from orbit and from
# the ground. 0 disables.
cloud_shadow_strength        = 0.45
# The sunlight direction that casts the cloud shadows - pair it with the
# [pbr] sun_direction lighting the scene (the demo's configuration ships
# them together). Night-side points get no shadow (no direct sun to block).
cloud_shadow_sun_direction   = [0.50, 0.45, 0.74]

# stars: a seed-derived star field for the space backdrop (see
# atmosphere.hpp starFieldColor). Consumers sample the pure direction-space
# function when they paint the space behind the planet; the demo meshes a
# star dome for its globe and orbit views and fades it with the atmosphere
# weight. stars_density tunes the star spacing (0 sparse, 1 dense skies),
# stars_brightness the luminance of the whole field.
stars_enabled     = true
stars_density     = 0.5
stars_brightness  = 1.0

# surface walking (kinematic controller; see walker.hpp): planet-centric
# gravity with the movement/collision windows a point-feet character needs.
# Speeds are meters/second, gravity meters/second^2; the collision windows
# are meters (or rise/run for the climb grade, a tangent value).
surface_gravity_mps2    = 9.81
walk_speed_mps          = 4.5
walk_sprint_multiplier  = 2.6
jump_speed_mps          = 5.0
eye_height_meters       = 1.7
walk_ground_snap_meters = 0.9
walk_max_step_up_meters = 0.55
walk_max_climb_grade    = 3.5
swim_enabled            = true
swim_speed_mps          = 2.6
swim_wade_depth_meters  = 1.2

# how many planets one module instance may keep alive at once (each owns a
# chunk-build worker pool). createPlanet reports CapacityReached beyond it.
max_live_planets        = 16

# sky backdrop (see atmosphere.hpp): the gradient a camera inside the air
# sees, from the horizon color up to the zenith color (linear RGB, like the
# water colors), fading out to space over atmosphere_height_meters of eye
# altitude. Consumers tint it by the sun's elevation (sunset gold, night
# blue). atmosphere_enabled = false leaves the sky to the consumer.
atmosphere_enabled         = true
atmosphere_height_meters   = 20000.0
atmosphere_zenith_color    = [0.040, 0.130, 0.460]
atmosphere_horizon_color   = [0.220, 0.400, 0.780]

# climate
equator_temperature        = 1.0
pole_temperature           = 0.02
temperature_perturbation   = 0.09
temperature_wavelength_meters = 20000.0
temperature_lapse_meters   = 1100.0
moisture_wavelength_meters = 14000.0
moisture_perturbation      = 0.24
# moisture_warp_amplitude bends the humidity field into elongated, organic
# shapes; unwrapped, biome patches read as round camouflage blobs.
moisture_warp_amplitude    = 0.22
# coastal_moisture_boost: onshore humidity - low land near the sea stays
# green (without it the flat shoreline belt paints a beige desert fringe
# around every landmass and the globe reads as speckled). Fades out over
# coastal_moisture_band_meters of elevation.
coastal_moisture_boost     = 0.18
coastal_moisture_band_meters = 400.0
moisture_latitude_bands    = true
color_variation            = 0.24
# feature size of the albedo jitter field (the mottling that keeps large
# biomes from reading as flat plastic sheets).
color_variation_wavelength_meters = 260.0
# near-field mottle octave on the same field: ground-level views keep
# surface texture instead of one unbroken color. Keep the wavelength above
# twice the finest voxel (the LOD band limit fades octaves below it - at the
# showcase's 2.6 m voxels an 11 m mottle renders at full strength).
color_variation_ground_wavelength_meters = 11.0
# Sea-level snow line (drops as climate cools; only the highest massifs are
# glaciated, polar caps come from latitude alone).
snow_line_meters           = 2400.0
beach_width_meters         = 5.0
# Swash band: sand right above the waterline reads wet and dark. Width 0
# disables; the darkening keys how dark the wet sand gets (0.45 = clearly
# darker but still sand-colored).
beach_wet_width_meters     = 6.0
beach_wet_darkening        = 0.45
rock_slope_threshold       = 0.46
# luminance banding of rock faces at the strata band spacing (sediment
# stripes); 0 disables.
rock_strata_contrast       = 0.30

# biome color BLENDING (see docs/configuration.md): biome colors interpolate
# between palette rows over these widths instead of hard-switching per vertex
# (hard switches smear into pale stains across triangles).
biome_blend_width          = 0.06
slope_blend_width          = 0.08
elevation_blend_fraction   = 0.12

# biome palette, linear RGB rows in Biome enum order:
# deep ocean, ocean, shallow ocean, beach, desert, savanna,
# grassland, shrubland, temperate forest, seasonal forest,
# tropical rainforest, temperate rainforest, taiga, tundra,
# snow, rock
# The ocean-floor rows sit deliberately DARKER than the water surface colors
# (water_color_*): the floor is only seen through the water tint, and when the
# two matched, the sea read as a flat sheet of sea floor with no water at all.
biome_palette = [
    0.006, 0.024, 0.055,   0.013, 0.048, 0.100,   0.034, 0.115, 0.165,
    0.540, 0.490, 0.350,   0.560, 0.500, 0.330,   0.520, 0.470, 0.245,
    0.360, 0.500, 0.220,   0.310, 0.355, 0.165,   0.180, 0.330, 0.130,
    0.130, 0.360, 0.120,   0.100, 0.310, 0.090,   0.090, 0.280, 0.110,
    0.150, 0.260, 0.180,   0.480, 0.500, 0.450,   0.870, 0.900, 0.930,
    0.280, 0.250, 0.210,
]
