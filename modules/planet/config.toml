# planet module configuration defaults.
#
# Every generation knob of the module lives here; the struct defaults in
# params.hpp mirror these values. All lengths are meters (planets scale to
# arbitrary radii - raise radius_meters and the wavelengths/amplitudes that
# should scale with it), angles/axes are unit vectors, colors are linear RGB
# rows in Biome enum order (see types.hpp).

[planet]
seed                   = 1337
# The showcase planet is Earth-scale (radius 6,371 km, the volumetric mean
# value NASA's Earth fact sheet carries): the metric close-range layers
# below (hills, gullies, strata at real absolute heights) then land at
# real-Earth relief fractions (~0.05% of the radius), a standing eye meets
# its horizon at the ~4.7 km a real 1.7 m eye sees, and the large-scale
# layers below carry wavelengths scaled to this radius.
radius_meters          = 6371000.0
sea_level_offset_meters = 0.0
axis                   = [0.0, 1.0, 0.0]

# octree / LOD
leaf_grid_n              = 16
target_voxel_meters      = 2.0
# Hard depth cap (bounded by the chunk key's 5-bit depth field, see
# types.hpp; 19 is also the coordinate packing's own limit).
max_depth_limit          = 19
# refine while the chunk's voxel subtends more than this many radians at the
# eye (screen-space LOD): detail follows apparent size, independent of planet
# radius, viewport and zoom. Smaller = finer views everywhere, but the visible
# chunk count grows quadratically; 0.02 keeps the finest voxel within ~200 m
# of a ground-level eye.
lod_angular_voxel_radians = 0.02
# per-depth low-pass: density content below voxel * factor fades out before
# coarse chunks sample it. Without this, sub-voxel detail octaves alias into
# random spikes on every coarse LOD surface (the "spiky globe"). Marching
# cubes needs ~4 samples per wavelength for smooth surfaces: content below
# voxel * lod_band_limit_factor fades to zero, reaching full strength at twice
# that. 3.0 keeps the marginal 3-4-voxel content (the mountain and regional
# belts a globe view's coarse voxels sample) out of the mesh entirely - at
# that sampling ratio marching cubes resolves the belt as shimmering shard
# facets instead of terrain - while every closer view's features sit far
# above the gate and render unchanged.
lod_band_limit_factor    = 3.0
horizon_culling          = true
# Streaming coverage for visible chunks whose mesh has not finished building:
# such a chunk draws its nearest finished ancestor whose LOD suits its
# distance (the selection's screen-space rule with a 2x tolerance) instead of
# contributing nothing, and the streamer additionally requests the chunk's
# coarsest pure ancestor (the coarsest one under which no finished visible
# chunk lies, so its mesh covers the hole without overlapping finished
# geometry). The planet therefore appears coarse-first and sharpens in place
# as the fine meshes land. The scaffold budget caps how many of those
# ancestor builds are requested per update (0 disables scaffold builds; the
# draw-side fallback then uses only ancestors that exist anyway).
lod_missing_fallback     = true
lod_scaffold_builds_per_update = 8
bounding_factor          = 1.4
# Eye movement (meters) below which update() keeps the previous visible
# selection: descent, balancing, conform masks and stamping are all skipped
# while the eye drifts less than this (the streaming passes still run). 0
# picks the finest voxel, which no LOD decision can cross.
selection_update_distance_meters = 0.0
# Octree node records (probe verdicts, cached geometry) live this many
# selections before the prune pass drops them, and the prune runs every this
# many selections. Longer lifetimes keep revisited views free of the
# first-visit field probes.
node_record_lifetime_updates       = 96
node_record_prune_interval_updates = 16
# async chunk builds: several thousand chunks can be selected at once by the
# screen-space LOD on ground views, so the pipeline runs wide open by default
# (one build per worker). Lower these for interactive use on small machines.
max_concurrent_builds    = 16
max_new_builds_per_update = 48
# Consecutive updates with queued work but no delivered mesh after which one
# chunk builds inline on the calling thread (streaming fallback for machines
# too small to give the pool any CPU). 0 keeps the pool-only behavior.
starved_inline_build_interval_updates = 30
chunk_eviction_updates   = 240
# The cache must hold the whole visible set plus working room: at ground views
# on the Earth-scale planet the screen-space LOD selects thousands of chunks
# (depth 13-19); a cache smaller than the visible set evicts ready meshes and
# rebuilds them in a churn loop.
chunk_cache_capacity     = 16384

# relief shaping
# Large-scale layers (continents ... regional) carry wavelengths scaled to the
# Earth-scale radius (6,371 km): real continents span 3,000-8,000 km, orogenic
# belts keep ~1,000 km spacing and regional plateaus/basins ride 300-1,000 km
# - the values below land inside those real bands, which is what makes the
# globe read as textured landmasses and mountain ranges instead of smooth
# blobs at any capture resolution.
continent_amplitude_meters   = 700.0
continent_wavelength_meters  = 3610000.0
# Fewer octaves = fewer medium patches: landmass cores stay contiguous and
# coastline complexity comes from the warp plus the hills near the shore.
continent_octaves            = 4
# domain_warp_amplitude is an ANGULAR displacement (fraction of a radian-ish
# bend of the sample direction): at radius R it shears features by roughly
# amplitude * R meters. 0.18 at 60 km bends coastlines by ~10 km without
# shredding landmasses into filaments (0.5 sheared ~30 km - archipelagos).
domain_warp_amplitude        = 0.18
domain_warp_wavelength_meters = 1487000.0
mountain_amplitude_meters    = 3000.0
mountain_wavelength_meters   = 956000.0
mountain_mask_low            = 0.08
mountain_mask_high           = 0.45
mountain_sharpness           = 1.25
mountain_octaves             = 5
# mountain profile shaping: the ridged crest field rides on a broad smooth
# mass field (mountain_mass_fraction splits the amplitude), and a broad
# range-cluster field groups uplift into distinct ranges with foothill gaps
# (range_cluster_strength). Without them, mountains read as uniform
# needle/rib carpets.
mountain_mass_fraction        = 0.50
# wavelength of the broad mass field as a multiple of the crest wavelength.
mountain_mass_wavelength_multiple = 1.8
# crest weight at zero mass: higher keeps ribbed crest lines alive across
# low-mass country, lower concentrates ridges on the big massifs.
mountain_crest_mass_coupling  = 0.35
range_cluster_strength        = 0.55
# continent-field window where the range-cluster gate opens / saturates.
range_cluster_gate_low        = -0.35
range_cluster_gate_high       = 0.45
range_cluster_wavelength_meters = 2124000.0
# eroded mountains: with mountain_erosion_weight at 1 the belt relief comes
# from an analytic erosion filter (Advanced Terrain Erosion, Rune Skovbo
# Johansen / Luke Mitchell) - directional gully stripes aligned with the
# slope carve branching valleys and leave sharp ridges, sampled per point
# with no simulated water, so streaming chunks of any size agree. 0 keeps
# the classic mass-and-crest profile; in between blends the two.
mountain_erosion_weight       = 1.0
# mountain_erosion_unit_meters: the arc length ONE filter unit spans - the
# METRIC ridge/valley/gully scale the eroded belts carry (real ridge spacing
# runs 1-10 km), independent of the belt-placement mountain wavelength above
# (~1,000 km, the spacing real orogenic systems keep). 0 derives the unit
# from the mountain wavelength (small-planet convenience).
mountain_erosion_unit_meters = 9000.0
# width of the cubemap face-blend window (fraction of the dominant axis):
# stripes continue across face seams through this band.
mountain_erosion_face_blend_width = 0.02
# base terrain the filter erodes: one filter unit spans
# mountain_wavelength_meters of arc, so massifs sit at the wavelength
# divided by the frequency, with the amplitude in the filter's [0, 1]
# height band and fractal octaves at the gain / lacunarity.
mountain_erosion_terrain_frequency  = 1.0
mountain_erosion_terrain_amplitude  = 0.25
mountain_erosion_terrain_octaves    = 3
mountain_erosion_terrain_gain       = 0.10
mountain_erosion_terrain_lacunarity = 2.0
# height offset compensating the gully stack's ridge-up bias (scaled by the
# accumulated erosion magnitude); the blend mixes in the negated fade target.
mountain_erosion_height_offset_low  = -0.35
mountain_erosion_height_offset_blend = 0.0
# gully stack: the coarsest stripes span scale x cell_scale filter units
# (x mountain_wavelength_meters), each octave at gain / lacunarity; strength
# is the erosion amplitude, gully_weight the stripes' share against the fade
# target (lower keeps peaks pointy), detail restricts finer gullies to
# steeper ground, normalization is the partial stripe re-normalization.
mountain_erosion_scale         = 0.28
mountain_erosion_strength      = 0.30
mountain_erosion_gully_weight  = 0.55
mountain_erosion_detail        = 1.2
mountain_erosion_cell_scale    = 0.70
mountain_erosion_normalization = 0.50
mountain_erosion_octaves       = 5
mountain_erosion_gain          = 0.80
mountain_erosion_lacunarity    = 2.0
# edge rounding: ridge / crease softening of the gully profile, scaled by
# the global multiplier which itself compounds per octave.
mountain_erosion_rounding_ridge  = 0.10
mountain_erosion_rounding_crease = 0.00
mountain_erosion_rounding_global = 0.10
mountain_erosion_rounding_gain   = 2.0
# slope onset thresholds (input terrain, per octave, ridge map, ridge-map
# mask): how steep the ground must be before gullies appear there.
mountain_erosion_onset_input      = 1.25
mountain_erosion_onset_octave     = 1.25
mountain_erosion_onset_ridge_map  = 2.80
mountain_erosion_onset_ridge_mask = 1.50
# assumed slope: gully directions use this fixed slope magnitude blended
# over the terrain's own slope (blend 1 = fully assumed), which keeps them
# aligned through rounded peaks and valley floors.
mountain_erosion_assumed_slope       = 0.70
mountain_erosion_assumed_slope_blend = 1.0
# output remap: the filter's height band maps linearly onto the mountain
# profile between these bounds, so valley floors reach the belt base and
# crests the full mountain amplitude.
mountain_erosion_profile_low  = 0.30
mountain_erosion_profile_high = 0.52
# regional relief: broad plateaus/basins/valley systems between the continent
# and hill bands - the layer that carries landform structure at globe scale.
regional_amplitude_meters    = 140.0
regional_wavelength_meters   = 690000.0
regional_octaves             = 3
# Close-range layers stay metric (independent of the planet radius): rolling
# hills, surface roughness, overhangs and strata are features a walker sees.
hill_amplitude_meters        = 110.0
hill_wavelength_meters       = 1000.0
hill_octaves                 = 5
# fine detail layer: surface roughness between the hill wavelength and the
# voxel size (rock ribs, soil ripples). detail_plains_fraction keeps flat
# ground walkable (values above ~0.3 boil plains into noise lumps);
# mountains/cliffs carry full strength.
detail_amplitude_meters      = 14.0
detail_wavelength_meters     = 120.0
detail_plains_fraction       = 0.22
detail_octaves               = 4
terrace_strength             = 0.95
terrace_steps                = 9.0
# Fraction of each terrace step the riser spans; small values make the
# genuinely cliff-like faces (grade = flank slope / fraction). 0.4 smears
# steps into long shoulders; below ~0.1 the riser thins under one voxel.
terrace_riser_fraction       = 0.15
cliff_wavelength_meters      = 1400.0
# Cliff-mask gate over the terrain's own steepness energy. Terracing, strata
# banding and overhang weighting ride this mask, so the gate decides where
# mesa country forms: the mask opens where the cliff-noise crest bands
# (cliff_sharpness concentrates them) or mountain massif flanks carry real
# slope, keeping plains smooth. Lower cliff_steepness_low widens terraced
# country; raise cliff_sharpness to tighten it into narrow band country.
cliff_steepness_low          = 0.42
cliff_steepness_high         = 0.70
cliff_sharpness              = 2.6

# true-3D terms (overhangs, strata, caves)
# overhang_plains_fraction: how much 3D displacement survives on flat ground;
# large values boil plains into noise lumps.
overhang_amplitude_meters   = 38.0
overhang_wavelength_meters  = 300.0
overhang_plains_fraction    = 0.06
# strata: banded rock on cliff faces. strata_warp bends the bands; values
# >= 2 fold the sinusoid into nested ripple rings (an artefact, not geology).
strata_amplitude_meters     = 3.0
strata_band_meters          = 34.0
strata_warp                 = 1.1
# strata is additionally gated to genuinely terraced country: the cliff-mask
# window below decides where the banding opens / saturates; open slopes keep
# no corduroy banding at all.
strata_gate_low             = 0.34
strata_gate_high            = 0.85

# geologic provinces: a very-low-frequency field classifies every landmass
# region into layered sedimentary country (warm bedded tones, stronger strata
# and terraces), shield/volcanic country (cool gray tones, weaker strata) and
# pale carbonate patches; the geometry biases and the rock albedo read the
# same field, so cliff faces look and structure themselves as one geology.
# wavelength 0 derives 1.6x the continent wavelength (provinces span whole
# landmass regions).
provinces_enabled           = true
province_wavelength_meters  = 0.0
province_rock_variation     = 0.55
province_strata_bias        = 0.35
province_terrace_bias       = 0.30
caves_enabled               = false
cave_threshold              = 0.16
cave_worm_wavelength_meters = 240.0
cave_carve_meters           = 60.0

# coastal shaping: detail (hills, terraces, overhangs, strata) is damped
# toward the waterline so shorelines slope into the sea instead of breaking
# into a web of sub-sea ponds with beach rims.
coastal_flatten_meters      = 80.0
coastal_flatten_floor       = 0.10
# fractions of coastal_flatten_meters where the taper reaches full damping
# (below full_fraction) and full detail strength (above reach_fraction).
coastal_flatten_full_fraction  = 0.45
coastal_flatten_reach_fraction = 1.6

# oceans
shallow_water_meters    = 18.0
deep_water_meters       = 140.0
# Abyssal deepening: the sea floor sinks from the shoreline into the basins
# toward this extra depth (on top of the continent amplitude), carving real
# ocean profiles - sunlit shelves at the coast sloping into dark abyssal
# plains - instead of one uniformly shallow flooded plain. 0 disables.
abyssal_depth_meters    = 3500.0
# continent-field window the abyssal mask rides (negative = basins): the sea
# floor sinks where the continent field sits inside this band.
abyssal_mask_low        = -0.60
abyssal_mask_high       = -0.02
# height fractions of the continent amplitude where the submarine fade closes
# (below low_fraction: ocean-floor detail fully suppressed) and opens (above
# high_fraction: land detail untouched).
submarine_fade_low_fraction  = 0.02
submarine_fade_high_fraction = 0.06
water_depth_tint_meters = 70.0
# Shallow shelf: the surface blends toward the beach-sand tone transmitted
# by the water's own hue over this depth band, so flats read sandy turquoise
# (the bottom seen through the sheet). 0 disables.
water_shore_mix_meters  = 12.0
# brightness lift of the sand seen through the shallow shelf (sunlit flats
# under a thin sheet read brighter than the raw beach palette row).
water_shore_sand_brightness = 1.35
water_enabled           = true
water_color_shallow     = [0.095, 0.258, 0.272]
# The deep open-ocean color under full sun: real orbital photography reads
# the lit open ocean as saturated royal blue (the water column's absorption
# leaves a blue that photographs bright against cloud white, not navy-black
# that merges with night-side shadow) - the channels below land there.
water_color_deep        = [0.022, 0.095, 0.210]
# gloss of the ocean surface at close range: low values give the sea a
# crisp sun-glint path that the per-vertex wave normals break into glitter.
water_roughness         = 0.15
# the high-altitude blend target for the same hint: orbital eyes look down
# on flat far-water facets whose per-facet mirror would sparkle, so the
# material widens the lobe toward this value with eye altitude. 0.46 keeps
# the glint broad enough that the far-water facet grid never photographs
# through the lobe (the Cox-Munk sea-state slope spread plus margin for the
# coarse far-water facets), so the glint reads as the broad, smoothly
# attenuating glitter patch orbital photographs show instead of a small
# clipped highlight or a faceted plate pattern.
water_roughness_orbital = 0.46
# Surf: a white breaker band where the water shallows toward the shore,
# noise-modulated so it breaks into wave crests instead of a painted stripe.
# Strength 0 disables; width is the depth band under the surface that reads
# as surf (real breaker zones sit in the first few meters of depth).
water_foam_width_meters = 14.0
water_foam_strength    = 0.72
# falloff exponent of the breaker band across its depth range: 2 keeps a broad
# wash of surf over the whole shallow shelf, 4 squeezes it into a tight rim at
# the waterline (real surf hugs the shore).
water_foam_falloff_exponent = 3.0

# sea ice: the water surface freezes where the SEA-LEVEL temperature drops
# below sea_ice_temperature (the same climate field that drives the land's
# freeze line, so polar oceans ice over where the land turns tundra, with an
# organic noise-shaped edge). 0 disables. sea_ice_transition blends the ice
# color in over that much temperature around the threshold.
sea_ice_temperature     = 0.10
sea_ice_transition      = 0.05
# Sea ice reads slightly BLUE against the warm white of the cloud tops, so
# polar caps stay distinguishable from the weather layer at globe scale.
water_color_ice         = [0.78, 0.85, 0.94]

# wave slope: deterministic noise tilts the water surface normals around the
# radial direction, giving the sea sun-glint texture at close range. The
# amplitude is a radian-scale tilt and fades out under the LOD band limit
# like every other noise term, so coarse chunks keep a smooth sea.
water_wave_amplitude          = 0.28
water_wave_wavelength_meters  = 8.0
# amplitude of the half-wavelength chop riding the swell, as a fraction of the
# swell tilt (the chop breaks the sun glint into sparkle). 0 = single-scale
# swell.
water_wave_chop_fraction      = 0.33

# clouds: a pure coverage field on a spherical shell above the datum (see
# atmosphere.hpp). The demo meshes the shell for its globe and orbit views;
# consumers can paint the same field anywhere. cloud_coverage is the
# approximate sky fraction under cloud, cloud_wavelength_meters the feature
# scale (raise it with radius_meters like the other large-scale layers),
# cloud_altitude_meters the shell height, cloud_detail_strength the
# amplitude of the fine breakup octave (bank edges read as ragged cumulus)
# and cloud_billow_strength the amplitude of the cellular lobe octave
# (rounded cumulus clumping inside the banks).
# cloud_edge_softness is the threshold band half-width: narrow values scatter
# crisp clumps, wide ones grow soft decks with veiled edges.
# cloud_weather_strength is the amplitude of the very-low-frequency regional
# weather shift that organizes banks into large cloudy and clear systems.
# cloud_latitude_band_strength adds the circulation-cell banding every
# rotating atmosphere shows (wet equatorial belt, dry subtropics, stormy
# mid-latitudes), keyed to the spin axis.
clouds_enabled               = true
# Global coverage fraction the field's threshold targets. Real Earth runs
# ~55-67% cloudy from orbit, but the visible fraction reads higher than the
# threshold because the latitude bands and weather organization stack their
# banks on top of the base - a 0.42 threshold with the banded field reads as
# a near-continuous deck that buries the landmasses. The base stays near
# half so the clear lanes between the systems carry the land/ocean contrast
# the disc needs to read as a planet instead of a cloud ball.
cloud_coverage               = 0.40
# feature scale of the cloud field (raise it with radius_meters like the
# other large-scale layers). Real weather SYSTEMS run 1,000-2,500 km across,
# but the individual masses an orbital photograph reads as "clouds" sit
# ~200-800 km; the bank wavelength targets that read (the weather field
# below organizes the banks into the larger systems), so a disc carries
# dozens of distinct masses instead of a handful of continental smears.
cloud_wavelength_meters      = 520000.0
# height of the cloud shell above the datum: real cumulus bases ride
# ~300-2,400 m over land.
cloud_altitude_meters        = 2000.0
cloud_detail_strength        = 0.35
# cloud_billow_strength is the amplitude of the inverted-cellular billow
# octave relative to the base field: it packs the rounded cumulus lobes into
# the bank bodies (the Perlin-Worley pairing volumetric-cloud pipelines use
# - smooth fBm alone reads as soft cotton). 0 keeps purely smooth banks.
cloud_billow_strength        = 0.32
cloud_edge_softness          = 0.22
cloud_weather_strength       = 0.45
# cloud_weather_wavelength_multiple is the weather field's wavelength as a
# multiple of the cloud field's own wavelength: larger values organize the
# banks into fewer, broader weather systems.
cloud_weather_wavelength_multiple = 4.0
cloud_latitude_band_strength = 0.16
# cloud_wisp_strength is the wisp octave pair's amplitude share on the
# texture path (see coverageTexel): the fine torn fringes under every mesh
# grid's resolution. cloud_convective_strength is the cellular convective
# pair's amplitude: the rounded clumping a ground-level eye parses as
# cumulus structure (the sky above ~25 deg of elevation samples only a few
# kilometers of the cloud shell, so the clumps are the scale that patch
# photographs at; from orbit the pair reads as the cotton-wool grain of
# real decks). cloud_cyclone_strength scales the seed-derived storm
# vortices' shear. All three keys tune the baked cloud texture only; mesh
# consumers band-limit them out.
cloud_wisp_strength          = 0.18
cloud_convective_strength    = 0.50
cloud_cyclone_strength       = 0.45
# METRIC wavelengths of the texture-detail octaves above (independent of the
# radius-scaled cloud_wavelength_meters): real cumulus clumps span ~2 km and
# open-cell convection packs them into ~8 km fields, so the ground view keeps
# its cumulus scale at any planet radius while banks and weather systems
# ride the big wavelength. The wisp pair carries ragged fringes at
# cumulus-edge scale. 0 derives each from cloud_wavelength_meters
# (small-planet convenience).
cloud_convective_wavelength_meters      = 8000.0
cloud_convective_fine_wavelength_meters = 2000.0
cloud_wisp_wavelength_a_meters          = 540.0
cloud_wisp_wavelength_b_meters          = 325.0
# cloud_band_frequency is the latitudinal band frequency (radians of phase
# per radian of latitude): ~3.4 places a wet equatorial belt, dry subtropics
# and wet mid-latitudes the way Earth's circulation cells do. 0 gives a
# latitude-blind field on top of the weather systems.
cloud_band_frequency         = 3.4
cloud_color                  = [0.985, 0.975, 0.955]
# cloud_shadow_strength darkens the terrain and water albedo under the same
# coverage field the cloud layer renders from, sampled along the sun ray
# through each point (see cloud_shadow_sun_direction), so the shadows fall
# away from their banks and agree with the cloud layer from orbit and from
# the ground. 0 disables.
cloud_shadow_strength        = 0.12
# penumbra softening of the cast shadows: the shadow field widens the coverage
# edge band by this fraction, so shadows read as soft-edged darkening under
# their banks instead of a hard copy of the cloud outlines. 0 keeps the shadow
# exactly as sharp as the banks above it.
cloud_shadow_softness        = 0.72
# Terrain self-shading: the mesher darkens each terrain vertex by the relief
# the sun ray out of it meets (a fixed-resolution march of the density field
# up-sun, see docs/configuration.md), so escarpments and ravine walls cast
# shade into their lee. The shade rides the vertex albedo beside the cloud
# shadow and shares its sun direction; 0 disables.
terrain_self_shadow_strength = 0.78
# How far up-sun the march resolves occluders (an escarpment's shadow reach).
# The march's own density band rides at a sixth of it, and the whole march is
# LOD-independent so chunks at different depths agree on shared vertices.
terrain_self_shadow_reach_meters = 260.0
# The sunlight direction that casts the cloud shadows (and the terrain
# self-shading above) - pair it with the
# [pbr] sun_direction lighting the scene (the demo's configuration ships
# them together). Night-side points get no shadow (no direct sun to block).
cloud_shadow_sun_direction   = [0.50, 0.45, 0.74]

# high cirrus deck: a thin ice-crystal veil above the cloud shell (see
# atmosphere.hpp cirrusStreakWeight). The streaks stretch along the latitude
# circles the way the upper-level wind blows them, broken into filaments and
# thresholded by cirrus_coverage_amount's quantile. Consumers mesh the deck as
# a translucent shell (the demo's globe and orbit views); cirrus_strength is
# its brightness (0 reads as a clear sky), cirrus_altitude_meters keeps it
# above the cumulus shell.
cirrus_enabled            = true
cirrus_strength           = 1.0
# the deck keeps above the cumulus shell at the real cirrus band: high
# ice-crystal veils ride 6-13 km, near the tropopause.
cirrus_altitude_meters    = 11000.0
cirrus_coverage_amount    = 0.30

# stars: a seed-derived star field for the space backdrop (see
# atmosphere.hpp starFieldColor). Consumers sample the pure direction-space
# function when they paint the space behind the planet; the demo meshes a
# star dome for its globe and orbit views and fades it with the atmosphere
# weight. stars_density tunes the star spacing (0 sparse, 1 dense skies),
# stars_brightness the luminance of the whole field.
stars_enabled     = true
stars_density     = 0.5
stars_brightness  = 1.0
# Disc size range the star backdrop draws per star (radius grows with the
# square root of the star's brightness between the two): radians of sky the
# faintest and the brightest star's discs subtend. Point-like defaults keep
# the field crisp at capture resolutions; raise the maximum for deliberately
# prominent bright stars (a coin at 0.006, a soft blob past 0.012 - the
# validate() clamp).
star_disc_radius_min_radians = 0.0011
star_disc_radius_max_radians = 0.0024

# galaxy: the star field concentrates along a seed-derived great circle -
# the galactic plane. Cells near the plane light up several times more often
# and run brighter, streaked by a seed-derived dark rift of dust lanes, so a
# space backdrop reads as a Milky Way band over the uniform scatter instead
# of an undifferentiated star field. galaxy_band_strength 0 keeps the
# uniform field; the width is the band's angular half-width on the sky.
galaxy_band_strength      = 1.0
galaxy_band_width_radians = 0.35

# moon: a companion body the module places by a pure orbital model (a
# direction on the sky; see moonDirection in atmosphere.hpp) and the demo
# shades as a LIT sphere - the same sun that lights the terrain lights it,
# so the phase, terminator and crescent come from the shading itself and
# stay consistent with the scene from every view height. The angular radius
# is configured directly (the demo scales its backdrop mesh to it), the
# orbital period drives the sweep (in seconds; the phase anchor sits about a
# quarter radian ahead of the sub-sun meridian so a waxing gibbous companion
# rides the daylight sky in every daytime view), the inclination tilts the orbit plane
# off the equator, and the albedo scales the regolith's brightness.
moon_enabled                  = true
moon_angular_radius_radians    = 0.0080
moon_orbital_period_seconds    = 1200.0
moon_orbit_inclination_radians = 0.35
moon_albedo                    = 1.0

# aurora: a translucent emissive curtain ring above each spin pole that
# glows only on the night side (baked against the run's sun direction), so
# space views read a green arc along the dark limb while day-side and
# twilight ground views stay clean. aurora_strength 0 disables the glow.
aurora_enabled  = true
aurora_strength = 0.35

# surface scatter: the ground-level real-world elements the terrain's color
# field cannot express - vegetation, surface rocks, bird flocks, breaking-wave
# foam and valley mist. The module owns the density rules (which climate state
# carries which element and how much); consumers scatter their own geometry
# against them (the demo deterministically, seeded from the planet seed and
# camera cell). *_density multiplies each element's climate-derived presence
# (0 disables that element); the radii bound the scatter ring around the eye;
# scatter_rebuild_distance_meters is the camera movement that triggers a
# re-scatter. whitecap_strength reads as breaking-crest speckle on open water
# and follows whitecap_wind_speed_mps (the 10 m wind speed the sea state
# tracks; whitecaps start forming near 3 m/s and the fraction climbs roughly
# with the cube of the wind). surf_foam lays the shore-parallel bands of
# breaking foam along the waterline. valley_mist pools soft fog banks in low
# ground (strongest toward sunrise, when real radiation fog peaks).
vegetation_enabled               = true
vegetation_tree_density          = 1.0
vegetation_bush_density          = 1.0
vegetation_grass_density         = 1.0
vegetation_tree_radius_meters    = 1400.0
vegetation_grass_radius_meters   = 56.0
surface_rock_density             = 1.0
surface_rock_radius_meters       = 300.0
# contact shadows: soft dark quads laid on the ground under every scattered
# tree, bush and rock, offset and stretched along the away-from-sun direction
# by the site's sun elevation (a low sun drags the shadow long and pale).
# Strength 0 disables them.
surface_shadow_strength          = 1.0
whitecap_enabled                 = true
whitecap_strength                = 0.65
whitecap_wind_speed_mps          = 9.0
surf_foam_enabled                = true
surf_foam_strength               = 0.70
# birds: distant flocks render as a few-pixel sprite specks - at capture
# resolutions the eye parses those specks as floating artifacts, so the
# default keeps the skies empty (a run that wants them sets the key true).
birds_enabled                    = false
bird_flock_count                 = 2.0
bird_flock_size                  = 9.0
valley_mist_enabled              = true
valley_mist_strength             = 0.30
scatter_rebuild_distance_meters  = 18.0

# surface walking (kinematic controller; see walker.hpp): planet-centric
# gravity with the movement/collision windows a point-feet character needs.
# Speeds are meters/second, gravity meters/second^2; the collision windows
# are meters (or rise/run for the climb grade, a tangent value).
surface_gravity_mps2    = 9.81
walk_speed_mps          = 4.5
walk_sprint_multiplier  = 2.6
jump_speed_mps          = 5.0
eye_height_meters       = 1.7
walk_ground_snap_meters = 0.9
walk_max_step_up_meters = 0.55
walk_max_climb_grade    = 3.5
# speed cap of the falling integration (bounds the landing probe a long fall
# needs).
walk_terminal_velocity_mps = 55.0
swim_enabled            = true
swim_speed_mps          = 2.6
swim_wade_depth_meters  = 1.2

# how many planets one module instance may keep alive at once (each owns a
# chunk-build worker pool). createPlanet reports CapacityReached beyond it.
max_live_planets        = 16

# sky backdrop (see atmosphere.hpp): the gradient a camera inside the air
# sees, from the horizon color up to the zenith color (linear RGB, like the
# water colors), fading out to space over atmosphere_height_meters of eye
# altitude. Consumers tint it by the sun's elevation (sunset gold, night
# blue). atmosphere_enabled = false leaves the sky to the consumer.
atmosphere_enabled         = true
# Earth's visible air shell: the Kármán line sits at 100 km, 1.6% of the
# radius - the thin blue limb real orbital photographs show. The sky fade
# keeps a ground-level camera fully inside the air regardless (see
# atmosphereWeight's fade floor).
atmosphere_height_meters   = 100000.0
# Aerial perspective: how fast sight lines through the air haze over. The
# scale is the exponential's scale length in meters (the distance at which
# the haze has covered ~63% of its asymptote) - larger values keep the
# midground clear and let the far ridge dissolve gradually; the asymptote
# caps the haze weight at infinite distance, keeping the farthest terrain
# faintly readable as terrain instead of fading fully into sky. 8 km is the
# middle of the real clear-air band (Koschmieder visibilities of 20-80 km
# imply 5-20 km extinction scale lengths); the showcase's ground views
# override tighter (photographic haze) while orbital eyes ride the fade
# toward space. Set the asymptote to 0 to see the terrain without any
# aerial perspective.
aerial_perspective_scale_meters  = 8000.0
aerial_perspective_asymptote     = 0.65
# sun_direct_tint_strength: how strongly the DIRECT sun light (terrain,
# water, specular glints, the sun disc) adopts the atmosphere's
# transmittance tint - the warm-to-red shift the sun's own light gains as
# its path through the air lengthens toward the horizon (see
# sunDirectTint in atmosphere.hpp). 1 gives the physical curve, 0 keeps the
# consumer's configured sun color unchanged at every elevation. The
# scattered light (sky gradient, haze) keeps its own sunset tint either way.
sun_direct_tint_strength         = 1.0
# Sun-side sky structure (see the sun-aware skyGradientColor twin in
# atmosphere.hpp): sky_sun_halo_strength whitens the forward-scatter glare
# wedge around the sun and brightens the horizon band on the sun's side of
# the dome (the anti-sun sky keeps the deep saturated blue), while
# sky_warm_horizon_strength carries the gold the sun side of the horizon
# takes on through the low-sun band. 0 restores the sun-independent
# zenith-to-horizon ramp exactly.
sky_sun_halo_strength            = 0.32
sky_warm_horizon_strength        = 0.50
atmosphere_zenith_color    = [0.060, 0.170, 0.580]
atmosphere_horizon_color   = [0.470, 0.620, 0.860]

# climate
equator_temperature        = 1.0
pole_temperature           = 0.12
temperature_perturbation   = 0.09
temperature_wavelength_meters = 2124000.0
temperature_lapse_meters   = 1100.0
moisture_wavelength_meters = 1487000.0
moisture_perturbation      = 0.24
# moisture_warp_amplitude bends the humidity field into elongated, organic
# shapes; unwrapped, biome patches read as round camouflage blobs.
moisture_warp_amplitude    = 0.22
# coastal_moisture_boost: onshore humidity - low land near the sea stays
# green (without it the flat shoreline belt paints a beige desert fringe
# around every landmass and the globe reads as speckled). Fades out over
# coastal_moisture_band_meters of elevation.
coastal_moisture_boost     = 0.18
coastal_moisture_band_meters = 400.0
# continental interiors dry out away from the ocean: humidity drops as the
# continent field climbs into its interior cores, so landmass cores trend
# arid while the coasts keep their green fringe. 0 disables.
climate_continentality_strength = 0.30
# rain shadow: humidity drops downwind of mountain country - the mountain mass
# envelope is sampled upwind along the prevailing wind, so the lee side of
# every range carries a dry belt the way orographic precipitation leaves one.
# 0 disables.
climate_rain_shadow_strength = 0.35
# prevailing winds for the rain shadow: true follows the latitude zones every
# rotating planet shows (easterly trades in the tropics, westerlies over the
# temperate band, easterly polar winds), false blows uniformly west-to-east.
climate_wind_zones_enabled   = true
moisture_latitude_bands    = true
# amplitudes of the circulation-cell humidity belts (ITCZ wet belt on the
# equator, subtropical dry belts, a mild wet belt over the temperate
# westerlies, weak polar highs); 0 removes a belt.
moisture_belt_equator_amplitude     = 0.20
moisture_belt_subtropical_amplitude = -0.26
moisture_belt_temperate_amplitude   = 0.10
moisture_belt_polar_amplitude       = -0.06
color_variation            = 0.30
# feature size of the albedo jitter field (the mottling that keeps large
# biomes from reading as flat plastic sheets).
color_variation_wavelength_meters = 260.0
# near-field mottle octave on the same field: ground-level views keep
# surface texture instead of one unbroken color, and the octave rotates the
# hue (warm/dry vs cool/lush patches) instead of only shifting brightness.
# The wavelength rides WELL above four times the finest voxel (at the
# showcase's 2.6 m voxels): a vertex field sampled at four vertices per
# wavelength photographs as stretched linear gradients across the triangles
# - the "smeared texture" a ground eye reads - so the ground octave stays
# broad (smooth per-vertex hue patches) and the 1-4 m band belongs to the
# renderer's per-pixel procedural mottle, which no triangle grid samples.
color_variation_ground_wavelength_meters = 30.0
# erosion patches: a sparse ground-scale field pulls vegetated ground toward
# the bare-soil tone, so biome sheets break into soil scars and worn earth.
# strength 0 disables; the wavelength is the patch feature size (keep it
# above ~4x the finest voxel so the field survives the LOD band limit).
soil_patch_strength           = 0.30
soil_patch_wavelength_meters  = 60.0
# dryness mosaic: a broad ground-scale field senesces vegetated ground - the
# biome tone shifts toward its dry, yellow-tan counterpart over roughly a
# third of the surface, breaking grasslands, meadows and forest floors into
# the lush/dry mosaics real vegetation shows at walking and mid distance.
# strength 0 disables; the wavelength is the mosaic feature size (keep it
# above ~4x the finest voxel).
dry_patch_strength            = 0.45
dry_patch_wavelength_meters   = 30.0
# Sea-level snow line (drops as climate cools; only the highest massifs are
# glaciated, polar caps come from latitude alone).
snow_line_meters           = 2400.0
beach_width_meters         = 5.0
# Shoreline wobble: the beach band's width undulates along the shore with a
# low-frequency noise stream (feature size ~55 m), so the sand/grass boundary
# meanders like a real dune line instead of tracing the ruler-straight
# elevation contour the coastal flattening leaves; stretches the wobble
# pinches toward zero width simply have no beach. 0 keeps the constant
# beach_width_meters everywhere.
beach_shoreline_wobble     = 0.45
# Swash band: sand right above the waterline reads wet and dark. Width 0
# disables; the darkening keys how dark the wet sand gets (0.45 = clearly
# darker but still sand-colored).
beach_wet_width_meters     = 6.0
beach_wet_darkening        = 0.45
rock_slope_threshold       = 0.46
# luminance banding of rock faces at the strata band spacing (sediment
# stripes); 0 disables.
rock_strata_contrast       = 0.75

# surface texturing: the mesher partitions terrain into ground and rock
# surface groups and tiles texture coordinates over each with a continuous
# projective frame (ground keyed to the radial direction, rock to the
# cubemap-style blend of the axis planes - see docs/configuration.md). These
# keys set how many meters one texture tile spans per group: the consumer's
# textures meet the generator's tiling here.
terrain_texture_tile_meters_ground = 6.0
terrain_texture_tile_meters_rock   = 14.0
water_texture_tile_meters          = 8.0
# Anti-repetition of the tiled terrain frames (see docs/configuration.md):
# the UV warp bends the tile lattice with a low-frequency noise field so the
# world never photographs every tile at the same phase, and the per-chunk
# frame rotation turns each chunk's tiling by a deterministic multiple of 90
# degrees so neighboring chunks never photograph the same scan in the same
# orientation. The warp amplitude is in texture tiles (it scales with the
# tile sizes); 0 disables the warp, texture_chunk_rotation = false keeps
# every chunk's frame unrotated.
texture_uv_warp_strength          = 0.45
texture_uv_warp_wavelength_meters = 48.0
texture_chunk_rotation            = true

# biome color BLENDING (see docs/configuration.md): biome colors interpolate
# between palette rows over these widths instead of hard-switching per vertex
# (hard switches smear into pale stains across triangles).
biome_blend_width          = 0.06
slope_blend_width          = 0.08
elevation_blend_fraction   = 0.12

# biome palette, linear RGB rows in Biome enum order:
# deep ocean, ocean, shallow ocean, beach, desert, savanna,
# grassland, shrubland, temperate forest, seasonal forest,
# tropical rainforest, temperate rainforest, taiga, tundra,
# snow, rock
# The ocean-floor rows sit deliberately DARKER than the water surface colors
# (water_color_*): the floor is only seen through the water tint, and when the
# two matched, the sea read as a flat sheet of sea floor with no water at all.
biome_palette = [
    0.006, 0.024, 0.055,   0.013, 0.048, 0.100,   0.034, 0.115, 0.165,
    0.550, 0.460, 0.280,   0.480, 0.360, 0.180,   0.340, 0.300, 0.110,
    0.070, 0.185, 0.045,   0.150, 0.190, 0.070,   0.060, 0.130, 0.035,
    0.050, 0.130, 0.030,   0.035, 0.100, 0.025,   0.030, 0.090, 0.030,
    0.055, 0.105, 0.055,   0.260, 0.240, 0.170,   0.870, 0.900, 0.930,
    0.280, 0.250, 0.210,
]

# Debug: chunk-border overlay. debug_chunk_borders = true tints terrain and
# water vertices within debug_chunk_border_width_meters of their chunk's
# boundary planes, so every rendered chunk lights up as a grid cell on the
# surface - exposing selection density, LOD transitions and seam behavior
# on demand. Geometry and determinism are untouched; the overlay rides the
# vertex colors only.
debug_chunk_borders          = false
debug_chunk_border_width_meters = 2.0
