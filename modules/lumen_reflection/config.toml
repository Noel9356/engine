# Default values for the [lumen_reflection] configuration section. Every key
# is documented in docs/configuration.md; the budgets follow Lumen's
# published reflection settings scaled for CPU evaluation.

[lumen_reflection]
enabled = true
# Static-frame skip: with the camera, scene, and environment unchanged and
# the temporal history converged, evaluate() returns early and the exported
# field version stops changing (renderers polling it skip their per-frame
# upload too). Set false to always re-trace.
skip_unchanged_frames = true
# Quality preset (Auto 0, Low 1, Medium 2, High 3, Ultra 4) scales the
# resolution and ray budget; explicit keys below still cap the result.
quality = 3
# Reflection field resolution: 1/screen_scale of the viewport in each axis
# (Lumen's reflection tracing runs below full resolution - a quarter ray per
# pixel at its High tier - and the spatial/temporal filters reconstruct the
# full-resolution response; half of the viewport per axis keeps curved
# reflectors smooth while a quarter reads blocky on them at typical sizes).
screen_scale                = 2
# Stochastic rays per field pixel per frame; the temporal accumulation is the
# effective sample multiplier (a converged frame is hundreds of samples).
rays_per_pixel              = 1
# Sub-texel-jittered taps per texel for the near-mirror band (roughness below
# roughness.ray_band_max, transmissive texels included): a mirror surface's
# traced content is high-frequency at field resolution, so one texel-center
# sample aliases bright/dark edges into single-texel outliers; the jittered
# taps integrate the texel's world footprint and the temporal accumulation
# converges the per-frame rejittered draws. 1 disables the supersampling.
mirror_band_taps            = 4
# Short screen-trace distance: screen traces resolve only what the depth
# buffer covers within this radius, then hand off to the scene trace.
screen_ray_distance_m       = 2.0

[lumen_reflection.screen_trace]
# Screen-trace marching budget (steps) and thin-occluder thickness: a ray
# accepts the texel it lands behind when it passes the stored camera distance
# by at most thickness_m.
max_steps                  = 48
thickness_m                = 0.5
# Screen-trace tier toggle (Lumen's Screen Traces switch): false sends every
# dedicated ray straight to the scene trace, skipping the GBuffer march.
enabled                    = true

[lumen_reflection.scene]
max_surfaces                = 256
max_triangles_per_surface   = 200000

[lumen_reflection.roughness]
# Dedicated reflection rays are traced for roughness below ray_band_max
# (Lumen's 0.3 dedicated band); between ray_band_max and max_trace the
# response is resampled from the lumen_gi world radiance cache instead of
# tracing rays (Lumen's radiance-cache reuse band); above max_trace no
# specular environment term is evaluated (Lumen's Max Roughness To Trace).
ray_band_max                = 0.3
max_trace                   = 0.4

[lumen_reflection.trace]
max_distance_m              = 50.0
# Surface offset for reflection rays; same acne/leak knob as lumen_gi's
# trace.bias_m.
bias_m                      = 0.02
# How many interfaces a ray chain may cross through transparent or
# translucent surfaces (screen pass-throughs and refracted hops both count).
# A chain that exhausts the budget is absorbed. Glass panes cost two hops
# (entering and exiting the medium).
max_transmission_segments   = 3

[lumen_reflection.sky]
# Angular radius of the analytic sun disc the reflection module's sky answer
# carries: the sun disc geometry a scene draws for the eye is excluded from
# tracing by the environment contract (rays that reach it answer the
# environment's skylight instead), so mirror surfaces catch the sun only
# through this disc. The GI probes deliberately do not see it (their skylight
# excludes the direct sun term the pbr sun adds). Match the visible sun disc's
# angular size for glints that agree with the sky's rendering.
sun_disc_angular_radius_deg = 2.3

[lumen_reflection.temporal]
# Cap on the temporal history weight. The blend follows the running-mean
# ramp N/(N+1) over the texel's accumulated frames and never exceeds this
# value: 0 replaces every frame, 0.9 keeps an exponential tail of about ten
# frames, and 1.0 runs the unbounded running mean (the neighborhood clamp
# and the change detection below keep a long history honest). The history
# restarts on disocclusion and on a fresh sample that disagrees with the
# clamped history by more than the neighborhood spread.
strength                    = 0.99
# Neighborhood clamp width in standard deviations; the history is clamped to
# the current 3x3 neighborhood's mean +/- sigma * value, widened to the
# neighborhood's own min/max range so deterministic high-dynamic-range
# structure (an emissive edge's mirror image) survives the clamp, before
# blending so a changed scene cannot ghost through.
neighborhood_clamp_sigma    = 1.0

[lumen_reflection.filter]
# Physically based spatial reuse radius in pixels (BRDF-weighted averaging
# over screen-space neighbors, Lumen's spatial reuse pass).
spatial_reuse_radius       = 1
# Luminance variance threshold above which the variance-driven bilateral
# filter smooths a texel (the spatial reuse pass estimates the true
# neighborhood variance).
variance_threshold         = 0.02
# Variance-driven bilateral filter, Lumen's last-ditch pass: runs only where
# the spatial reuse left high variance, at double strength on disoccluded
# pixels, with tone-mapped weights so fireflies are crushed only here.
bilateral                  = true
bilateral_radius           = 2

[lumen_reflection.debug]
# Brute-force reference rays per texel for the Reference debug view (views
# render at the field resolution the renderer composites).
reference_samples           = 16
