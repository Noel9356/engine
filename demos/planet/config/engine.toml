# demo_planet: procedural planet generation test harness configuration.
#
# Headless by default (CI / screenshot runs): the window and renderer run on
# their CPU backends and the demo exports PPM screenshots. For a windowed run
# pass --set window.backend=glfw --set renderer.backend=vulkan (or edit here).
# The renderer's own LOD index-striding is disabled: the planet module does
# its own octree LOD and the striding shreds dense terrain meshes.

[engine]
active_plugins             = []
max_fps                 = 0
max_frame_delta_seconds = 0.25
max_worker_count        = 16
priority_aging_ms       = 250
queue_source_fairness   = false
worker_count            = 0

[pbr]
# Fixed sun for terrain shading; warm afternoon light at ~40 degrees
# elevation. A high noon sun flattens relief (everything lights the same);
# the lower elevation models hills and cliffs with real cast shading while
# still keeping land mid-tone. The sun dominates the ambient by ~50:1 so the
# terminator reads from space and backlit slopes go properly dark - with a
# fat ambient the night side of the globe photographs as dusk and terrain
# flattens into clay. The headless renderer exports LINEAR framebuffer
# values, so exposure is tuned for linear output: albedo x (ambient + sun x
# NdotL) should land mid-tones (~0.2-0.4) for land, ~0.9+ only for snow.
# NOTE: the [planet] cloud_shadow_sun_direction below must carry the SAME
# direction - the planet module's cloud shadows are cast by this sun.
ambient_intensity = 0.06
sun_color         = [1.0, 0.96, 0.88]
sun_direction     = [0.50, 0.45, 0.74]
sun_enabled       = true
sun_intensity     = 3.2

[planet]
# The demo's planet: seed and radius can be overridden per run with --seed /
# --radius (capability-level overrides; these are the only planet keys the
# demo forwards). Build-queue sizing and all generation knobs live in the
# module's own config (modules/planet/config.toml), which the kernel copies
# to runtime/config/modules/planet/. Deep screen-space LOD ground views pair
# with the demo's --warmup N (render-free build frames).
seed                   = 1337
radius_meters          = 60000.0
# Cloud shadows are cast by the [pbr] sun above; keep the two directions
# identical or the shadows disagree with the banks that should cast them.
cloud_shadow_sun_direction = [0.50, 0.45, 0.74]
# Sky-shell cloud tuning: the module defaults read crisp near the zenith
# (walking views look straight up into the bank bodies), so the demo widens
# the edge band and eases the billow lobes - banks dissolve into the sky
# instead of cutting off at hard blob boundaries.
cloud_edge_softness   = 0.30
cloud_billow_strength = 0.26

[renderer]
backend     = "headless"
clear_color = [0.012, 0.014, 0.028, 1.0]
lod_enabled = false
# Terrain must render TWO-SIDED: the planet's marching-cubes meshes carry
# legitimate inward-facing surfaces (overhang undersides, cave walls), and
# the headless backend's per-triangle cull test on the declared winding
# (MeshMaterial::frontFaceWinding) costs more than it saves on these views -
# the chunk triangles are small, the view fills the frame with front faces,
# and the hidden far side rejects per pixel at the depth test anyway.
back_face_culling = false
# Draw-command sorting groups state changes; every planet chunk is its own
# mesh with a one-material draw, so sorting buys nothing here - and the
# frame's backdrop ensemble (atmosphere limb, sky dome, cloud decks) is
# layered by SUBMISSION ORDER ahead of the depth-tested scene. Sorting by
# mesh handle would scramble that order. Submission order it is.
draw_sort_mode = "off"

[trust]
trustModules = ["renderer"]

[window]
backend = "headless"
height  = 540
width   = 960
