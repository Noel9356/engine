# demo_planet: procedural planet generation test harness configuration.
#
# Headless by default (CI / screenshot runs): the window and renderer run on
# their CPU backends and the demo exports PPM screenshots. For a windowed run
# pass --set window.backend=glfw --set renderer.backend=vulkan (or edit here).
# The renderer's own LOD index-striding is disabled: the planet module does
# its own octree LOD and the striding shreds dense terrain meshes.

[engine]
active_plugins             = []
max_fps                 = 0
max_frame_delta_seconds = 0.25
max_worker_count        = 16
priority_aging_ms       = 250
queue_source_fairness   = false
worker_count            = 0

[pbr]
# Fixed sun for terrain shading; warm afternoon light at ~40 degrees
# elevation. A high noon sun flattens relief (everything lights the same);
# the lower elevation models hills and cliffs with real cast shading while
# still keeping land mid-tone. The headless renderer exports LINEAR
# framebuffer values, so exposure is tuned for linear output: albedo x
# (ambient + sun x NdotL) should land mid-tones (~0.2-0.4) for land,
# ~0.9+ only for snow.
ambient_intensity = 0.40
sun_color         = [1.0, 0.96, 0.88]
sun_direction     = [0.58, 0.50, 0.35]
sun_enabled       = true
sun_intensity     = 1.25

[planet]
# The demo's planet: seed and radius can be overridden per run with --seed /
# --radius (capability-level overrides; these are the only planet keys the
# demo forwards). Build-queue sizing and all generation knobs live in the
# module's own config (modules/planet/config.toml), which the kernel copies
# to runtime/config/modules/planet/. Deep screen-space LOD ground views pair
# with the demo's --warmup N (render-free build frames).
seed                   = 1337
radius_meters          = 60000.0

[renderer]
backend     = "headless"
clear_color = [0.012, 0.014, 0.028, 1.0]
lod_enabled = false
# Terrain must render TWO-SIDED: the planet's marching-cubes meshes carry
# legitimate inward-facing surfaces (overhang undersides, cave walls), and the
# headless backend's per-mesh winding vote (geometric face normal vs smoothed
# vertex normal) misclassifies rugged near-field terrain - its majority vote
# flips on noise-creased meshes and the front faces are culled away, leaving
# clear-color holes wherever the camera looks across rough ground at grazing
# angles. Disable the cull; the overdraw cost is acceptable for the demo.
back_face_culling = false

[trust]
trustModules = ["renderer"]

[window]
backend = "headless"
height  = 540
width   = 960
