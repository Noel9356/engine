# Sunlit profile for the outdoor view: overlays the app engine.toml and
# turns the sun on (later profiles/config values win over earlier ones).
#
# The ambient keys calibrate the analytic skylight to the visual sky dome:
# the dome's unlit base color IS the sky radiance the eye sees, and every
# sky-facing integration (the hemispheric ambient, the lumen_gi probes'
# sky-answer, the lumen_reflection miss tier) reads the same environment.
# With intensity 1.0 and the shared colors they all answer at the dome's
# brightness, so the polished water slab mirrors the sky it visibly sits
# under instead of a near-black one.

[pbr]
ambient_intensity      = 1.0
ambient_sky_color      = [0.55, 0.65, 0.80]
ambient_ground_color   = [0.35, 0.30, 0.25]
sun_color     = [1.0, 0.96, 0.88]
sun_direction = [0.45, 0.62, 0.35]
sun_enabled   = true
sun_intensity = 3.0
